<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="color-scheme" content="light dark">
<title>Dashboard</title>
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
</head>
<body>
<main class="page">
  <header class="masthead">
    <div class="masthead__top">
      <p class="eyebrow" id="date"></p>
      <button class="theme" id="theme" type="button" aria-label="Darstellung wechseln"></button>
    </div>
    <h1 id="title">Dashboard</h1>
    <p class="lead" id="briefing" hidden></p>
    <p class="stamp" id="stamp"></p>
  </header>
  <div id="board" class="board" aria-live="polite"></div>
</main>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
